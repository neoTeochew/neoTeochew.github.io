            </span>
            <label class="sr-only" for="q" data-i18n="searchLabel">检索关键词</label>
            <input id="q" name="q" type="search" placeholder="拍字等揣…… Phah zī thěng chuē..." data-i18n-placeholder="searchPlaceholder">
            <button class="search-btn" type="submit">
              <span data-i18n="searchButton">揣 CHUĒ</span>
              <span class="btn-arrow" aria-hidden="true">→</span>
            </button>
          </div>

          <div class="scope-row">
            <span class="row-label" data-i18n="scopeLabel">揣的范围</span>
            <div class="scope-chips">
              <label class="scope-chip">
                <input type="checkbox" checked data-scope="word">
                <span class="chip-mark" aria-hidden="true"></span>
                <span class="chip-text">
                  <span data-i18n="scopeWord">词 sûr</span>
                </span>
              </label>
              <label class="scope-chip">
                <input type="checkbox" checked data-scope="hanzi">
                <span class="chip-mark" aria-hidden="true"></span>
                <span class="chip-text">
                  <span data-i18n="scopeHanzi">汉字 Hànzì</span>
                </span>
              </label>
              <label class="scope-chip">
                <input type="checkbox" checked data-scope="meaning">
                <span class="chip-mark" aria-hidden="true"></span>
                <span class="chip-text">
                  <span data-i18n="scopeMeaning">意思 ì-sùr</span>
                </span>
              </label>
              <label class="scope-chip">
                <input type="checkbox" checked data-scope="translations">
                <span class="chip-mark" aria-hidden="true"></span>
                <span class="chip-text">
                  <span data-i18n="scopeTranslations">翻译 huan-êk</span>
                </span>
              </label>
            </div>
          </div>

          <div class="filter-row">
            <div class="filter-field">

            <div class="filter-field">
