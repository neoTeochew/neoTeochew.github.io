    <main class="main-content">
        <div class="search-box">
            <h2>潮语辞典</h2>

            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="输入要搜索的词">
                <button class="btn btn-primary" id="searchBtn">查找</button>
                <button class="btn btn-secondary" id="randomBtn">随机</button>
                <button class="btn btn-secondary" id="allBtn">全部</button>
            </div>

            <div class="filter-section">
                <div class="filter-section-title">搜索范围</div>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="searchItem" checked>
                        <span>词汇</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="searchHanzi" checked>
                        <span>汉字</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="searchDefinition">
                        <span>定义</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="searchExample">
                        <span>用例</span>
                    </label>
                </div>
            </div>

            <div class="select-filter">
                <select class="filter-select" id="speechFilter">
                    <option value="">所有词性</option>
                </select>
                <select class="filter-select" id="tagFilter">
                    <option value="">所有标签</option>
                </select>
            </div>

            <div class="filter-section">
                <div class="filter-section-title">首音节限定</div>
                <div class="phonetic-filters">
                    <label>
                        声母:
                        <select id="shengmuFilter">
                            <option value="">不限</option>
                        </select>
                    </label>
                    <label>
                        韵母:
                        <select id="yunmuFilter">
                            <option value="">不限</option>
                        </select>
                    </label>
                    <label>
                        声调:
                        <select id="toneFilter">
                            <option value="">不限</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="stats-bar">
                <p>目前收录了 <span id="totalCount">0</span> 个词汇和词组。</p>
                <p>á à â ǎ ā ó ò ô ǒ ō é è ê ě ē í ì î ǐ ī ú ù û ǔ ū ḿ m̀ m̂ m̌ m̄ ń ǹ n̂ ň n̄</p>
                <p>原本的数据主要注重数量，收录得太乱了，现在重新整理，目前正在整理声母p。其他页面暂时先下了。</p>
            </div>

            <div class="search-results" id="searchResults">
            </div>
        </div>
    </main>

    <script src="../script.js"></script>
</body>
